<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Form</title>
    <link rel="stylesheet" href="portfolio.css">
</head>

<body>

    <h1>RSVP Form</h1>

    <form id="rsvpForm">

        <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="surname">Surname:</label><br>
            <input type="text" id="surname" name="surname" required>
        </p>

        <p>
            <label for="attending">Will you attend?</label><br>
            <select id="attending" name="attending">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </p>

        <p>
            <label for="guests">Number of Extra Guests:</label><br>
            <input type="number" id="guests" name="guests" min="0">
        </p>

        <button type="submit">Submit RSVP</button>

    </form>

    <script>

        const scriptURL = "https://script.google.com/macros/s/AKfycbxXlhphAcK70VMExJ3aU-C1hTqqGvRzjWA3BHoiJqC83wvK8J5xnyLfy0uMUL0nCvooqg/exec";

        document.getElementById("rsvpForm").addEventListener("submit", function (event) {

            event.preventDefault();

            const formData = new FormData(this);

            fetch(scriptURL, {
                method: "POST",
                body: formData
            })
            .then(() => {

                const attending = document.getElementById("attending").value;

                if (attending === "yes") {
                    window.location.href = "thank-you.html";
                } else {
                    window.location.href = "sorry-you-cant-make-it.html";
                }

            })
            .catch(error => console.error("Error!", error));

        });

    </script>

</body>

</html>
